name: mutacion
on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mutacion:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Falla si el puntaje baja de thresholds.break (stryker.config.json).
      - run: npm run mutacion
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutacion
          path: reports/mutation/
          if-no-files-found: ignore
